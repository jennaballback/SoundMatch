# Runs Postgres 16 locally. Start it with:  docker compose up -d
# Your data lives in the named volume "pgdata", so it survives restarts.
# To wipe everything and start fresh:       docker compose down -v
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: music
      POSTGRES_PASSWORD: music
      POSTGRES_DB: music
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
